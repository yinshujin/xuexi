name: Desktop apps (macOS / Windows)

# Optional: the PWA already works on Mac and Windows (install from Safari/Edge/Chrome).
# The Mac app is ad-hoc signed, not notarised: the first time, open it from
# System Settings → Privacy & Security → "Open Anyway" (or right-click → Open).
# On Windows choose "More info → Run anyway".
# Run from the Actions tab; the result is published as the `desktop-latest`
# release: …/releases/download/desktop-latest/xuexi-mac.dmg (and xuexi-windows-setup.exe).

on:
  workflow_dispatch:
    inputs:
      platform:
        description: Which apps to build
        type: choice
        options: [mac, windows, all]
        default: all
  push:
    tags: ['app-v*']

jobs:
  build:
    strategy:
      fail-fast: false
      matrix:
        include:
          - os: macos-latest
            platform: mac
            args: --target universal-apple-darwin
            rust_targets: aarch64-apple-darwin,x86_64-apple-darwin
          - os: windows-latest
            platform: windows
            # MSI (WiX) fails on the Chinese product name; the NSIS .exe installer handles it.
            args: --bundles nsis
            rust_targets: ''
    runs-on: ${{ matrix.os }}
    env:
      VITE_SITE_URL: ${{ vars.SITE_URL }}
      VITE_REPO_URL: ${{ github.server_url }}/${{ github.repository }}
    steps:
      - uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262 # v4
      - uses: pnpm/action-setup@b906affcce14559ad1aafd4ab0e942779e9f58b1 # v4
      - uses: actions/setup-node@49933ea5288caeca8642d1e84afbd3f7d6820020 # v4
        with:
          node-version: 22
          cache: pnpm
      - uses: dtolnay/rust-toolchain@6bed0761d98439e5a578e2877258200ad565ba87 # stable
        with:
          toolchain: stable
          targets: ${{ matrix.rust_targets }}
      - uses: Swatinem/rust-cache@6323deb102c322ba6fcbdcafc7e3dddab59af2b6 # v2
        with:
          workspaces: shells/tauri/src-tauri
      - run: pnpm install --frozen-lockfile
      - name: Bundle the published courses into the app
        shell: bash
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          set -euo pipefail
          mkdir -p bundles
          # 单元闯关 听音选择 / 拼写: every textbook word spoken (the word-audio release).
          gh release download word-audio --repo "$GITHUB_REPOSITORY" --pattern 'xuexi-word-audio.zip' --dir bundles ||
            echo "::notice::No word-audio release yet; building without word audio (听音选择 is left out)."
          if gh release download courses-latest --repo "$GITHUB_REPOSITORY" --pattern '*.zip' --dir bundles &&
            { gh release download books-sample --repo "$GITHUB_REPOSITORY" --pattern '*.zip' --dir bundles ||
              echo "::notice::No books-sample release yet; building without built-in picture books."; }; then
            pnpm content builtin bundles/*.zip
          else
            echo "::notice::No courses-latest release yet; building without built-in courses."
          fi
      - name: Skip this platform
        if: github.event_name == 'workflow_dispatch' && inputs.platform != 'all' && inputs.platform != matrix.platform
        shell: bash
        run: echo "SKIP=1" >> "$GITHUB_ENV"
      # Same versioning as the Android build: a new version every build.
      - name: Stamp a new version
        if: env.SKIP != '1'
        shell: bash
        working-directory: shells/tauri/src-tauri
        run: |
          set -euo pipefail
          NAME="0.1.${{ github.run_number }}"
          node -e '
            const fs = require("fs"); const f = "tauri.conf.json";
            const c = JSON.parse(fs.readFileSync(f, "utf8"));
            c.version = process.argv[1];
            fs.writeFileSync(f, JSON.stringify(c, null, 2) + "\n");
          ' "$NAME"
          echo "::notice::version $NAME"
      - if: env.SKIP != '1'
        working-directory: shells/tauri
        run: pnpm tauri build ${{ matrix.args }}
      - name: Collect the installer
        if: env.SKIP != '1'
        shell: bash
        run: |
          set -euo pipefail
          mkdir -p dist
          if [ "${{ matrix.platform }}" = mac ]; then
            f=$(find shells/tauri/src-tauri/target -path '*bundle/dmg/*.dmg' | head -n1)
            cp "$f" dist/xuexi-mac.dmg
            codesign -dv "$(find shells/tauri/src-tauri/target -maxdepth 6 -path '*bundle/macos/*.app' | head -n1)" 2>&1 | head -n 5
          else
            f=$(find shells/tauri/src-tauri/target -path '*bundle/nsis/*.exe' | head -n1)
            cp "$f" dist/xuexi-windows-setup.exe
          fi
          ls -la dist
      - if: env.SKIP != '1'
        uses: actions/upload-artifact@ea165f8d65b6e75b540449e92b4886f43607fa02 # v4
        with:
          name: xuexi-${{ matrix.platform }}
          path: dist/*
      - name: Attach to release
        if: env.SKIP != '1' && startsWith(github.ref, 'refs/tags/')
        uses: softprops/action-gh-release@3bb12739c298aeb8a4eeaf626c5b8d85266b0e65 # v2
        with:
          files: |
            shells/tauri/src-tauri/target/**/bundle/dmg/*.dmg
            shells/tauri/src-tauri/target/**/bundle/nsis/*.exe

  # Stable download links: …/releases/download/desktop-latest/xuexi-mac.dmg
  publish:
    needs: build
    if: "!startsWith(github.ref, 'refs/tags/')"
    runs-on: ubuntu-latest
    permissions:
      contents: write
    steps:
      - uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262 # v4
      - uses: actions/download-artifact@d3f86a106a0bac45b974a628896c90dbdf5c8093 # v4
        with:
          path: dist
          merge-multiple: true
      - name: Move the desktop-latest tag to this commit
        run: |
          ls -la dist
          git tag -f desktop-latest HEAD
          git push -f origin refs/tags/desktop-latest
      - uses: softprops/action-gh-release@3bb12739c298aeb8a4eeaf626c5b8d85266b0e65 # v2
        with:
          tag_name: desktop-latest
          name: 电脑版 App（Mac / Windows）
          body: |
            版本 0.1.${{ github.run_number }}，内置当时所有的讲解课、技巧课和绘本。
            Mac：下载 xuexi-mac.dmg，打开后把「学数学」拖进「应用程序」。第一次打开会提示“无法验证开发者”：
            到 系统设置 → 隐私与安全性，点「仍要打开」（或在应用程序里右键 → 打开）。跟读时允许使用麦克风。
            Windows：下载 xuexi-windows-setup.exe 安装，提示时选「更多信息 → 仍要运行」。
          files: dist/*
          overwrite_files: true
          make_latest: false

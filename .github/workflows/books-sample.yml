name: Sample books

# Open picture books from Book Dash and African Storybook (both CC BY 4.0)
# listed in content/books-sample/samples.json, narrated with edge-tts (with
# word timings) and published as the `books-sample` release, which the app
# builds in for 绘本跟读; books from the family's own subscriptions (RAZ …) are
# private and are only ever prepared on the parent's computer, never here.

on:
  workflow_dispatch:
  push:
    branches: [main, 'claude/**']
    paths:
      - content/books-sample/**
      - tools/content/src/books/**
      - tools/content/scripts/**
      - packages/course-pack/src/book.ts
      - .github/workflows/books-sample.yml

concurrency:
  group: books-sample
  cancel-in-progress: true

env:
  # A fixed revision of https://github.com/bookdash/bookdash-books
  BOOKDASH_REV: 54916310c5c06a5282e2d5d4add18d64f90e5fde

jobs:
  books:
    runs-on: ubuntu-latest
    permissions:
      contents: write
    steps:
      - uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262 # v4
      - uses: pnpm/action-setup@b906affcce14559ad1aafd4ab0e942779e9f58b1 # v4
      - uses: actions/setup-node@49933ea5288caeca8642d1e84afbd3f7d6820020 # v4
        with:
          node-version: 22
          cache: pnpm
      - run: pnpm install --frozen-lockfile
      - run: pip install edge-tts==7.2.8 pillow==12.3.0
      - uses: actions/cache@0057852bfaa89a56745cba8c7296529d2fc39830 # v4.3.0
        with:
          path: content/tts-cache
          key: book-tts-${{ github.run_id }}
          restore-keys: book-tts-
      - name: Fetch the Book Dash books
        run: |
          set -euo pipefail
          git init -q bookdash
          cd bookdash
          git remote add origin https://github.com/bookdash/bookdash-books.git
          git sparse-checkout init --no-cone
          {
            echo '/_data/'
            jq -r '.books[] | select(.source != "asb") | "/\(.slug)/en/"' ../content/books-sample/samples.json
          } | git sparse-checkout set --no-cone --stdin
          git fetch -q --depth 1 --filter=blob:none origin "$BOOKDASH_REV"
          git checkout -q FETCH_HEAD
      # Book Dash books from the checkout; African Storybook books are downloaded
      # from africanstorybook.org (pages converted to JPEG with Pillow).
      - name: Import
        run: pnpm content book import-samples bookdash
      - name: Narrate
        run: pnpm content book tts --tts-cache content/tts-cache
      - name: Export
        run: |
          set -euo pipefail
          mkdir -p dist
          pnpm content book export --title "开放绘本（African Storybook、Book Dash）" --out dist/xuexi-books-sample.zip
          pnpm -s content book list > dist/list.txt
          {
            echo "「绘本跟读」的开放绘本：A–J 级，每级 5 本左右（African Storybook、Book Dash，CC BY 4.0，原图原文）。"
            echo
            echo "这些绘本已经内置在最新的 App 里（孩子首页「📚 绘本跟读」）。"
            echo "旧版 App 可以下载 xuexi-books-sample.zip，在 家长模式 → 离线课程 → 选择课程包文件 导入。"
            echo
            echo '```'
            cat dist/list.txt
            echo '```'
            echo
            echo "绘本来自 [African Storybook](https://www.africanstorybook.org) 和 [Book Dash](https://bookdash.org)，按 CC BY 4.0 使用，作者、插画和版权署名见每本书的封面页。"
          } > dist/release.md
      - name: Move the books-sample tag to this commit
        run: |
          git tag -f books-sample HEAD
          git push -f origin refs/tags/books-sample
      - name: Publish as the books-sample release
        uses: softprops/action-gh-release@3bb12739c298aeb8a4eeaf626c5b8d85266b0e65 # v2
        with:
          tag_name: books-sample
          name: 示例绘本（跟读试用）
          body_path: dist/release.md
          files: dist/xuexi-books-sample.zip
          overwrite_files: true
          make_latest: false

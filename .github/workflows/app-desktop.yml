name: Desktop apps (macOS / Windows)

# Optional: the PWA already works on Mac and Windows (install from Safari/Edge/Chrome).
# These builds are unsigned; on macOS right-click → Open the first time, on
# Windows choose "More info → Run anyway".

on:
  workflow_dispatch:
  push:
    tags: ['app-v*']

jobs:
  build:
    strategy:
      fail-fast: false
      matrix:
        include:
          - os: macos-latest
            args: --target universal-apple-darwin
            rust_targets: aarch64-apple-darwin,x86_64-apple-darwin
          - os: windows-latest
            args: ''
            rust_targets: ''
    runs-on: ${{ matrix.os }}
    env:
      VITE_SITE_URL: ${{ vars.SITE_URL }}
    steps:
      - uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262 # v4
      - uses: pnpm/action-setup@b906affcce14559ad1aafd4ab0e942779e9f58b1 # v4
      - uses: actions/setup-node@49933ea5288caeca8642d1e84afbd3f7d6820020 # v4
        with:
          node-version: 22
          cache: pnpm
      - uses: dtolnay/rust-toolchain@6bed0761d98439e5a578e2877258200ad565ba87 # stable
        with:
          toolchain: stable
          targets: ${{ matrix.rust_targets }}
      - uses: Swatinem/rust-cache@6323deb102c322ba6fcbdcafc7e3dddab59af2b6 # v2
        with:
          workspaces: shells/tauri/src-tauri
      - run: pnpm install --frozen-lockfile
      - working-directory: shells/tauri
        run: pnpm tauri build ${{ matrix.args }}
      - uses: actions/upload-artifact@ea165f8d65b6e75b540449e92b4886f43607fa02 # v4
        with:
          name: xuexi-${{ matrix.os }}
          path: |
            shells/tauri/src-tauri/target/**/bundle/dmg/*.dmg
            shells/tauri/src-tauri/target/**/bundle/nsis/*.exe
            shells/tauri/src-tauri/target/**/bundle/msi/*.msi
      - name: Attach to release
        if: startsWith(github.ref, 'refs/tags/')
        uses: softprops/action-gh-release@3bb12739c298aeb8a4eeaf626c5b8d85266b0e65 # v2
        with:
          files: |
            shells/tauri/src-tauri/target/**/bundle/dmg/*.dmg
            shells/tauri/src-tauri/target/**/bundle/nsis/*.exe

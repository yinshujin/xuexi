name: Android APK

# Builds one universal APK for the Huawei tablet (HarmonyOS 4.x) and the vivo phone,
# with the lessons from the courses-latest release built in.
# Runs automatically after CI passes on the default branch (and then publishes the
# APK as the "app-latest" release, which the EdgeOne deploy puts on the site at
# /download/xuexi.apk), or manually from the Actions tab.
#
# Signing (strongly recommended, otherwise every build has a different key and
# you must uninstall before updating): create a keystore once with
#   bash shells/tauri/scripts/create-keystore.sh
# and add the printed values as repository secrets:
#   ANDROID_KEYSTORE_BASE64, ANDROID_KEYSTORE_PASSWORD, ANDROID_KEY_ALIAS
# Optional repository variable SITE_URL (e.g. https://xuexi.example.com/) is baked
# in as the default site address on the login screen.

on:
  workflow_dispatch:
  workflow_run:
    # Also after new course bundles, so the APK ships the latest lessons.
    workflows: [CI, Course bundles]
    types: [completed]
  push:
    tags: ['app-v*']

concurrency:
  group: android-apk
  cancel-in-progress: true

jobs:
  apk:
    # After CI: only when it passed on the default branch.
    if: >-
      github.event_name != 'workflow_run' ||
      (github.event.workflow_run.conclusion == 'success' &&
       github.event.workflow_run.head_branch == github.event.repository.default_branch)
    runs-on: ubuntu-latest
    permissions:
      contents: write
    env:
      VITE_SITE_URL: ${{ vars.SITE_URL }}
      VITE_REPO_URL: ${{ github.server_url }}/${{ github.repository }}
    steps:
      - uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262 # v4
        with:
          ref: ${{ github.event.workflow_run.head_sha || github.sha }}
      - uses: pnpm/action-setup@b906affcce14559ad1aafd4ab0e942779e9f58b1 # v4
      - uses: actions/setup-node@49933ea5288caeca8642d1e84afbd3f7d6820020 # v4
        with:
          node-version: 22
          cache: pnpm
      - uses: actions/setup-java@cf277c60eb25467037889841efdb72551f06f6c3 # v4
        with:
          distribution: temurin
          java-version: 17
      # The ubuntu runner image ships the Android SDK (ANDROID_HOME) and NDKs
      # (ANDROID_NDK_LATEST_HOME); only make sure the platform / build tools exist.
      - name: Set up Android SDK and NDK
        run: |
          set -euo pipefail
          SDKMANAGER="$(ls -d "$ANDROID_HOME"/cmdline-tools/*/bin | sort -V | tail -n1)/sdkmanager"
          yes | "$SDKMANAGER" --licenses > /dev/null || true
          "$SDKMANAGER" --install "platforms;android-34" "build-tools;34.0.0" "platform-tools"
          echo "NDK_HOME=${ANDROID_NDK_LATEST_HOME}" >> "$GITHUB_ENV"
          echo "Using NDK ${ANDROID_NDK_LATEST_HOME}"
      - uses: dtolnay/rust-toolchain@6bed0761d98439e5a578e2877258200ad565ba87 # stable
        with:
          toolchain: stable
          targets: aarch64-linux-android
      - uses: Swatinem/rust-cache@6323deb102c322ba6fcbdcafc7e3dddab59af2b6 # v2
        with:
          workspaces: shells/tauri/src-tauri
      - run: pnpm install --frozen-lockfile
      - name: Bundle the published courses into the app
        shell: bash
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          set -euo pipefail
          mkdir -p bundles
          if gh release download courses-latest --repo "$GITHUB_REPOSITORY" --pattern '*.zip' --dir bundles; then
            pnpm content builtin bundles/*.zip
          else
            echo "::notice::No courses-latest release yet; building without built-in courses."
          fi
      - name: Generate Android project
        working-directory: shells/tauri
        run: |
          if [ ! -d src-tauri/gen/android ]; then pnpm tauri android init --ci; fi
      - name: Build release APK
        working-directory: shells/tauri
        # 64-bit ARM only: the Huawei tablet (HarmonyOS 4) and the vivo phone are arm64, and
        # Tauri embeds the web assets (including the built-in lessons) once per ABI.
        run: pnpm tauri android build --apk --ci --target aarch64
      - name: Sign APK
        env:
          KEYSTORE_B64: ${{ secrets.ANDROID_KEYSTORE_BASE64 }}
          KEYSTORE_PASSWORD: ${{ secrets.ANDROID_KEYSTORE_PASSWORD }}
          KEY_ALIAS: ${{ secrets.ANDROID_KEY_ALIAS }}
        run: |
          set -euo pipefail
          BT="$ANDROID_HOME/build-tools/34.0.0"
          UNSIGNED=$(find shells/tauri/src-tauri/gen/android -name '*release-unsigned.apk' | head -n1)
          test -n "$UNSIGNED"
          mkdir -p dist
          "$BT/zipalign" -f -p 4 "$UNSIGNED" dist/aligned.apk
          if [ -n "${KEYSTORE_B64:-}" ]; then
            echo "$KEYSTORE_B64" | base64 -d > release.jks
            ALIAS="${KEY_ALIAS:-xuexi}"; PASS="$KEYSTORE_PASSWORD"
          else
            echo "::warning::No signing secrets configured; signing with a throwaway key (uninstall before updating)."
            keytool -genkeypair -keystore release.jks -storepass throwaway -keypass throwaway \
              -alias xuexi -keyalg RSA -keysize 2048 -validity 10000 -dname "CN=xuexi"
            ALIAS=xuexi; PASS=throwaway
          fi
          "$BT/apksigner" sign --ks release.jks --ks-pass "pass:$PASS" --ks-key-alias "$ALIAS" \
            --out dist/xuexi.apk dist/aligned.apk
          rm -f dist/aligned.apk release.jks
          "$BT/apksigner" verify --print-certs dist/*.apk | head -n 3
      - uses: actions/upload-artifact@ea165f8d65b6e75b540449e92b4886f43607fa02 # v4
        with:
          name: xuexi-android
          path: dist/*.apk
      - name: Attach to release
        if: startsWith(github.ref, 'refs/tags/')
        uses: softprops/action-gh-release@3bb12739c298aeb8a4eeaf626c5b8d85266b0e65 # v2
        with:
          files: dist/*.apk
      # Keep a stable download: https://github.com/<repo>/releases/download/app-latest/xuexi.apk
      - name: Move the app-latest tag to this commit
        if: "!startsWith(github.ref, 'refs/tags/')"
        run: |
          git tag -f app-latest HEAD
          git push -f origin refs/tags/app-latest
      - name: Publish as the app-latest release
        if: "!startsWith(github.ref, 'refs/tags/')"
        uses: softprops/action-gh-release@3bb12739c298aeb8a4eeaf626c5b8d85266b0e65 # v2
        with:
          tag_name: app-latest
          name: 最新 App（自动构建）
          body: 每次代码或课程更新后自动构建，已内置当时所有的讲解课和技巧课。华为平板和 vivo 手机下载 xuexi.apk 覆盖安装即可，学习记录不会丢。
          files: dist/xuexi.apk
          overwrite_files: true
          make_latest: true

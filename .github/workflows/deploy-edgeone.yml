name: Deploy to EdgeOne

# Builds the web app + sync API and deploys it to EdgeOne Pages (free plan).
# Runs automatically after the Android APK workflow succeeds (i.e. after every
# code change that passed CI), or manually. Courses already published on the site
# are kept (downloaded from the live site first), and the latest APK is served at
# /download/xuexi.apk for the in-app update prompt.
#
# One-time setup (see deploy/edgeone/README.md):
#   Secret   EDGEONE_API_TOKEN   EdgeOne Pages console -> API Token
#   Variable EDGEONE_PROJECT     optional, default xuexi-family
#   Variable SITE_URL            optional, e.g. https://xuexi.example.com/ (enables keeping live courses
#                                and becomes the default site address in the APK)

on:
  workflow_dispatch:
    inputs:
      area:
        description: 'Acceleration area, only used when the project is created (overseas = no ICP filing needed)'
        type: choice
        options: [overseas, global]
        default: overseas
  workflow_run:
    workflows: [Android APK]
    types: [completed]

concurrency:
  group: deploy-edgeone
  cancel-in-progress: false

jobs:
  deploy:
    if: >-
      github.event_name != 'workflow_run' ||
      (github.event.workflow_run.conclusion == 'success' &&
       github.event.workflow_run.head_branch == github.event.repository.default_branch)
    runs-on: ubuntu-latest
    env:
      VITE_SITE_URL: ${{ vars.SITE_URL }}
      VITE_REPO_URL: ${{ github.server_url }}/${{ github.repository }}
    steps:
      - name: Check that EdgeOne is set up
        id: setup
        env:
          EDGEONE_API_TOKEN: ${{ secrets.EDGEONE_API_TOKEN }}
        run: |
          if [ -z "$EDGEONE_API_TOKEN" ]; then
            echo "::notice::EDGEONE_API_TOKEN is not set yet; skipping the deploy (see deploy/edgeone/README.md)."
            echo "ready=false" >> "$GITHUB_OUTPUT"
          else
            echo "ready=true" >> "$GITHUB_OUTPUT"
          fi
      - uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262 # v4
        if: steps.setup.outputs.ready == 'true'
        with:
          ref: ${{ github.event.workflow_run.head_sha || github.sha }}
      - uses: pnpm/action-setup@b906affcce14559ad1aafd4ab0e942779e9f58b1 # v4
        if: steps.setup.outputs.ready == 'true'
      - uses: actions/setup-node@49933ea5288caeca8642d1e84afbd3f7d6820020 # v4
        if: steps.setup.outputs.ready == 'true'
        with:
          node-version: 22
          cache: pnpm
      - run: pnpm install --frozen-lockfile
        if: steps.setup.outputs.ready == 'true'
      - name: Build site
        if: steps.setup.outputs.ready == 'true'
        run: pnpm content publish --target dir --allow-empty
      - name: Add the latest APK (for the in-app update prompt)
        if: steps.setup.outputs.ready == 'true'
        run: |
          mkdir -p content/site/download
          curl -fsSL -o content/site/download/xuexi.apk \
            "https://github.com/${{ github.repository }}/releases/download/app-latest/xuexi.apk" \
            || { rm -f content/site/download/xuexi.apk; echo "::notice::No app-latest release yet; the site will not offer an APK download."; }
      - name: Keep courses already published on the live site
        if: steps.setup.outputs.ready == 'true' && vars.SITE_URL != ''
        run: node deploy/edgeone/fetch-live-packs.mjs "${{ vars.SITE_URL }}" content/site
      - name: Deploy
        if: steps.setup.outputs.ready == 'true'
        env:
          EDGEONE_API_TOKEN: ${{ secrets.EDGEONE_API_TOKEN }}
          EDGEONE_PROJECT: ${{ vars.EDGEONE_PROJECT || 'xuexi-family' }}
          EDGEONE_AREA: ${{ inputs.area || 'overseas' }}
        run: bash deploy/edgeone/deploy.sh content/site
      - name: Check the sync API
        if: steps.setup.outputs.ready == 'true' && vars.SITE_URL != ''
        run: |
          curl -sS --max-time 20 "${{ vars.SITE_URL }}api/health" || true
          echo
